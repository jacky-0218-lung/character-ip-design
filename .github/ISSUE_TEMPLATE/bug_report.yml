name: Bug report
description: Something in the skill or tooling behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did the skill do, and what did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Agent / environment
      description: e.g. Claude Code, Cowork, Codex CLI
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
