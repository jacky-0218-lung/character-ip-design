name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository guard
        run: python3 tools/check_repository.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile all Python
        run: python3 -m compileall -q tools tests
      - name: Bundle digest (informational)
        run: python3 tools/skill_bundle.py digest skills/character-ip-design
