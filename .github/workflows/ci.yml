name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Repository guard
        run: python3 tools/check_repository.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile all Python
        run: python3 -m compileall -q tools tests
      - name: Bundle digest (informational)
        run: python3 tools/skill_bundle.py digest skills/character-ip-design
